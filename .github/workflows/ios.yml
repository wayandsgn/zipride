name: iOS build and UI test

on:
  pull_request:
    paths: ['Zipride/**', 'ZiprideUITests/**', 'project.yml', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['Zipride/**', 'ZiprideUITests/**', 'project.yml', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check image URLs
        continue-on-error: true
        run: |
          mkdir -p build
          ./scripts/check-urls.sh | tee build/urls.txt

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        timeout-minutes: 10
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          best=None
          for runtime,devs in data.items():
              if "iOS-26" not in runtime: continue
              for d in devs:
                  if d["name"].startswith("iPhone 17 Pro") and "Max" not in d["name"]: best=d["udid"]
                  elif best is None and d["name"].startswith("iPhone"): best=d["udid"]
          print(best or "")')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator with iOS 26 was found."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $UDID"
          # Boot before XCTest starts its application-launch deadline. This also
          # waits for first-boot setup instead of relying on a fixed sleep.
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and run UI tests
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -project Zipride.xcodeproj \
            -scheme Zipride \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/Results.xcresult \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E "error:|Test Case|\*\* |XCTAssert|failed" build/xcodebuild.log | head -200 || true
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Results.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/screenshots || true
            ls -la build/screenshots
            cat build/screenshots/manifest.json || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zipride-results
          path: |
            build/screenshots
            build/xcodebuild.log

      - name: Publish results to ci-results branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          OUT=$RUNNER_TEMP/out
          mkdir -p "$OUT"
          if [ -f build/screenshots/manifest.json ]; then
            python3 - "$OUT" <<'PY'
          import json, shutil, sys, re
          out = sys.argv[1]
          for test in json.load(open("build/screenshots/manifest.json")):
              for a in test.get("attachments", []):
                  name = a["suggestedHumanReadableName"]
                  if not a["exportedFileName"].endswith(".png") or not re.match(r"\d\d ", name):
                      continue
                  clean = re.sub(r"_0_[0-9A-F-]+\.png$", ".png", name).replace(" ", "-")
                  shutil.copy("build/screenshots/" + a["exportedFileName"], out + "/" + clean)
          PY
          fi
          cp build/urls.txt "$OUT/" 2>/dev/null || true
          grep -E "error:|warning: .*Zipride/|Test Case|\*\* |failed|XCTAssert" build/xcodebuild.log | head -300 > "$OUT/summary.txt" || true
          xcrun xcresulttool get test-results summary --path build/Results.xcresult > "$OUT/test-summary.json" 2>&1 || true
          cd "$OUT"
          git init -q -b ci-results
          git -c user.name=ci -c user.email=ci@zipride.app add -A
          git -c user.name=ci -c user.email=ci@zipride.app commit -qm "CI results ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
